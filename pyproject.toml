[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medh5"
version = "1.0.0a0"
description = "Self-describing HDF5 container for one medical imaging sample and all of its ground truth: multi-timepoint, multi-modal images with segmentation, detection, classification and registration labels."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Puyang Wang", email = "pauliwang411@gmail.com" },
]
keywords = [
  "medical imaging",
  "hdf5",
  "blosc2",
  "machine learning",
  "segmentation",
  "nifti",
  "dicom",
  "pytorch",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = [
  "h5py>=3.10",
  "hdf5plugin>=4.1",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "mypy>=1.0",
  "build>=1.0",
  "twine>=5.0",
  "jsonschema>=4.18",
]
schema = [
  # Without this the validator cannot check E005, and says so rather than
  # reporting a clean document it never inspected.
  "jsonschema>=4.18",
]
torch = [
  "torch>=2.0",
]
monai = [
  # Only needed for `medh5.monai`; the affine and metadata it builds are
  # computed without it, so the geometry is testable in a bare environment.
  "monai>=1.3",
  "torch>=2.0",
]
nifti = [
  "nibabel>=5",
]
dicom = [
  "pydicom>=2.4",
]
dicomseg = [
  # Reading DICOM SEG and RTSTRUCT needs only pydicom; *writing* a SEG needs
  # highdicom, the reference implementation of the Segmentation IOD.  Building
  # the per-frame functional groups by hand is how invalid SEGs get published.
  "highdicom>=0.22",
  "pydicom>=2.4",
]
itk = [
  "SimpleITK>=2.3",
]
interp = [
  # Only needed to evaluate a displacement field that declares
  # `interpolation: cubic`; linear interpolation is built in.
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/XwK-P/medh5"
Repository = "https://github.com/XwK-P/medh5"
Issues = "https://github.com/XwK-P/medh5/issues"
Changelog = "https://github.com/XwK-P/medh5/blob/main/CHANGELOG.md"

[project.scripts]
medh5 = "medh5.cli:main"
medh5-0x = "medh5.legacy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["medh5*"]

[tool.setuptools.package-data]
medh5 = ["py.typed", "schemas/*.json", "labels/vocabularies/*.json"]

[tool.pytest.ini_options]
addopts = "--cov=medh5 --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
# Reference/benchmark scripts published alongside the 1.0 spec. They are documentation
# artifacts meant to be read next to the prose -- deliberately compact, not library code.
extend-exclude = ["docs/design/benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# The 0.x implementation, kept importable until the 1.0 converters land and it is
# deleted wholesale (see docs/design/medh5-1.0-implementation-plan.md, phase 8).
# Its `np.ndarray` annotations predate the numpy/mypy generic-parameter
# requirement; retrofitting them buys nothing for code with a scheduled removal.
module = ["medh5.legacy.*"]
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = [
  "h5py",
  "h5py.*",
  "hdf5plugin",
  "hdf5plugin.*",
  "torch",
  "torch.*",
  "nibabel",
  "nibabel.*",
  "pydicom",
  "pydicom.*",
  "SimpleITK",
  "SimpleITK.*",
  "jsonschema",
  "jsonschema.*",
  "scipy",
  "scipy.*",
  "monai",
  "monai.*",
  "highdicom",
  "highdicom.*",
]
ignore_missing_imports = true
follow_imports = "skip"
