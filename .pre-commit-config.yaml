repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # `mkdocs.yml` carries a `!!python/object/apply:` tag to give MkDocs
        # GitHub's heading-slug function (see the comment there). `check-yaml`
        # parses with `yaml.safe_load`, which refuses that tag by design.
        # Excluding the one file keeps the check strict everywhere else --- the
        # alternative, `--unsafe`, would weaken it for every workflow too.
        exclude: ^mkdocs\.yml$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # The same ruff the `dev` extra pins and CI runs. Bump the two together:
    # a hook five minor versions behind formats differently from the gate.
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
