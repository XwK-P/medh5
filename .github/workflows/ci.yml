name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # `release.yml` runs this workflow on the tagged commit before publishing,
  # and publishes the wheels and binaries it built: what reaches PyPI, the
  # release page and Homebrew is what passed, not what passed on the pull
  # request.
  workflow_call:

# A new push to a pull request supersedes the run in progress.  Runs on `main`
# and on a release tag always complete: each is a record of that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job only reads the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # The engine and the native command line: formatting, lints, and every
    # Rust test --- unit tests, the conformance corpus, the README doctest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PyO3 links an interpreter into the extension crate's test binary.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    # `rust-version` in Cargo.toml is a promise to everyone who depends on the
    # crates; this is where it is kept.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          msrv=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --workspace --all-targets --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The pin in the `dev` extra, read from pyproject.toml: CI and a
      # developer's checkout run one version by construction.  Installing the
      # extra itself would compile the engine to run a linter.
      - run: pip install "$(python -c 'import tomllib; print(next(r for r in tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["dev"] if r.startswith("ruff")))')"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # mypy reads the engine's types from `medh5/_core.pyi`, so it needs no
      # build; `stubtest`, in the test suite, holds the stub to the built module.
      - run: pip install numpy "$(python -c 'import tomllib; print(next(r for r in tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["dev"] if r.startswith("mypy")))')"
      - run: mypy medh5

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The same pinned versions Read the Docs builds with, so a green build
      # here means a green build there.
      - run: pip install -r docs/requirements.txt
      # `--strict` turns MkDocs' link warnings into failures. The docs link
      # between pages and into a normative specification by clause heading; a
      # cross-reference that stopped resolving is a defect in the specification,
      # and this is the gate that catches it on the pull request rather than
      # after publication.
      - run: mkdocs build --strict

  build:
    # Every platform the project ships: the abi3 wheel and the native binary,
    # built together so HDF5 compiles once.  The release publishes these
    # artifacts as they are, so each is checked here: the binary runs the
    # conformance corpus, and the wheel imports and runs it too.
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    env:
      # The oldest macOS the wheel and the binary support; ignored elsewhere.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build in a manylinux container
        if: matrix.container
        run: docker run --rm -v "$PWD:/io" -w /io "${{ matrix.container }}" bash .github/scripts/build-dist.sh "${{ matrix.target }}"
      - name: Build
        if: ${{ !matrix.container }}
        shell: bash
        run: bash .github/scripts/build-dist.sh "${{ matrix.target }}"
      - name: The binary runs the conformance corpus
        shell: bash
        run: |
          exe=target/release/medh5
          if [[ -f "$exe.exe" ]]; then exe="$exe.exe"; fi
          "$exe" --version
          "$exe" conformance build "$RUNNER_TEMP/corpus-native"
          "$exe" conformance run "$RUNNER_TEMP/corpus-native"
      - name: The wheel installs and runs the conformance corpus
        shell: bash
        run: |
          pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import medh5; print(medh5.__version__, medh5.__file__)"
          medh5 --version
          medh5 conformance build corpus
          medh5 conformance run corpus
      # Not `dist`: when `release.yml` calls this workflow, the release's own
      # job uploads that name in the same run, and artifact names are unique.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-dist-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-cli-${{ matrix.target }}
          path: cli/*
          if-no-files-found: error

  sdist:
    # A platform without a wheel builds from the sdist, so CI does too: the
    # whole engine from the source distribution alone, in a clean directory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --upgrade maturin twine
      - run: maturin sdist --out dist
      - run: twine check dist/*
      - run: |
          cd "$RUNNER_TEMP"
          pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          python -c "import medh5; print(medh5.__version__, medh5.__file__)"
          medh5 conformance build corpus
          medh5 conformance run corpus
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test:
    # The suite against the Linux wheel the release ships, on every supported
    # interpreter.  The checkout's `medh5/` is removed first: it has no
    # compiled engine, and on the path ahead of the wheel it would be what the
    # tests --- and `--cov=medh5` --- found.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-dist-x86_64-unknown-linux-gnu
          path: dist/
      - run: pip install "$(ls dist/*.whl)[dev,torch,nifti,dicom,dicomseg,itk]"
      - run: rm -rf medh5
      # A fresh install resolves numpy 2; say so, so the matrix is known to
      # cover it rather than covering it by accident of resolution.
      - run: python -c "import numpy; assert int(numpy.__version__.split('.')[0]) >= 2, numpy.__version__"
      - run: python -c "import medh5; assert 'site-packages' in medh5.__file__, medh5.__file__"
      # `-rs` prints the skips. A skipped test is not a passing test, and the
      # ones the suite has by design should be visible in every log.
      - run: pytest tests/ -v -rs --cov=medh5 --cov-report=term-missing --cov-fail-under=90

  test-macos:
    # macOS defaults to the `spawn` multiprocessing start method, which is
    # where DataLoader workers and process pools re-import the package.  One
    # interpreter: this job is about the start method, not the matrix.
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-dist-aarch64-apple-darwin
          path: dist/
      - run: pip install "$(ls dist/*.whl)[dev,torch,nifti,dicom,dicomseg,itk]"
      - run: rm -rf medh5
      - run: pytest tests/ -v -rs --cov=medh5 --cov-report=term-missing --cov-fail-under=90

  test-windows:
    # `os.replace` onto a file that is still open fails on Windows, which is
    # what the atomic-rewrite paths exist for.  Core extras only: the
    # optional-dependency paths are the Linux matrix's job.
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-dist-x86_64-pc-windows-msvc
          path: dist/
      - run: pip install "$(ls dist/*.whl)[dev,nifti,dicom,dicomseg]"
      - run: rm -rf medh5
      - run: pytest tests/ -v -rs --no-cov -p no:cacheprovider

  test-min-deps:
    # The NumPy floor `pyproject.toml` declares, on the oldest interpreter it
    # supports, with the floors of the test suite's own HDF5 tools. A floor
    # nothing installs is a floor nobody has checked.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-dist-x86_64-unknown-linux-gnu
          path: dist/
      - run: pip install "$(ls dist/*.whl)[dev]"
      - run: pip install "numpy==1.24.*" "h5py==3.13.*" "hdf5plugin==4.1.*"
      - run: python -c "from importlib.metadata import version; print(*(f'{p} {version(p)}' for p in ('numpy', 'h5py', 'hdf5plugin')))"
      - run: rm -rf medh5
      - run: pytest tests/ -v -rs --no-cov -p no:cacheprovider

  test-monai:
    # MONAI is a heavy dependency for a handful of tests, so it stays out of
    # the matrix and gets its own job rather than the `dev` extra --- but it
    # has to run *somewhere*.  `pytest.importorskip("monai")` skips silently
    # when it is absent, so `medh5.monai`'s level handling shipped covered by
    # a test that had never once executed.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-dist-x86_64-unknown-linux-gnu
          path: dist/
      - run: pip install "$(ls dist/*.whl)[dev,nifti,monai]"
      # The point of the job. Without this the run stays green when the import
      # fails and every test skips, which is the state it exists to prevent.
      - run: python -c "import monai, torch"
      - run: rm -rf medh5
      # Exit 5 if `-k` selects nothing, so a renamed class fails here too.
      - run: pytest tests/ -v -k "Monai or monai" --no-cov

  prototype:
    # Appendix C.2 publishes a table of results from the executable prototype
    # next to the spec.  Nothing referenced it, so that table was an ungated
    # claim -- unlike the corpus beside it, which CI runs on every push.  It
    # follows the specification with h5py alone, not with this package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install numpy h5py hdf5plugin jsonschema
      - run: |
          mkdir -p "$RUNNER_TEMP/prototype"
          cd "$RUNNER_TEMP/prototype"
          python "$GITHUB_WORKSPACE/docs/examples/reference_writer.py"
      # The prototype prints "[ok] ..." per check and raises otherwise, so a
      # non-zero exit above is the gate. Confirm it wrote where it was told,
      # rather than into the checkout.
      - run: test -f "$RUNNER_TEMP/prototype/case_0001.medh5"
      - run: git diff --exit-code

  conformance:
    # The corpus is a shipped artifact, not a test fixture: a third-party
    # implementation runs the same 152 cases, and is scored the same way.
    # Running it here through `publish` + `score` exercises the public path
    # rather than the in-process one.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-dist-x86_64-unknown-linux-gnu
          path: dist/
      - run: pip install dist/*.whl
      - run: rm -rf medh5
      - run: medh5 conformance run corpus/
      - run: medh5 conformance publish suite/
      - run: |
          python - <<'PY'
          import json, subprocess
          manifest = json.load(open("suite/expected.json"))
          results = []
          for case in manifest["cases"]:
              # No `check=True`: `validate` exits non-zero for a file with
              # errors, and 103 of the 152 cases are deliberately invalid. The
              # exit code is the answer, not a failure.
              out = subprocess.run(
                  ["medh5", "validate", f"suite/{case['file']}",
                   "--level", case["level"], "--json"],
                  capture_output=True, text=True,
              ).stdout
              report = json.loads(out)[0]
              results.append({"file": case["file"], "diagnostics": report["diagnostics"]})
          json.dump(results, open("results.json", "w"))
          PY
      - run: medh5 conformance score suite/ results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-suite
          path: suite/
