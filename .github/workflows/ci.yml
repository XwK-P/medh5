name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # From the dev extra, so CI and a developer's checkout run the same
      # version by construction rather than by coincidence.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The same pinned versions Read the Docs builds with, so a green build
      # here means a green build there.
      - run: pip install -r docs/requirements.txt
      # `--strict` turns MkDocs' link warnings into failures. The docs carry 61
      # relative links between pages and a normative specification with 88
      # clause headings; a cross-reference that stopped resolving is a defect in
      # the specification, and this is the gate that catches it on the pull
      # request rather than after publication.
      - run: mkdocs build --strict

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy medh5

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,schema,torch,nifti,dicom,dicomseg,itk,interp]"
      # A fresh install resolves numpy 2; say so, so the matrix is known to
      # cover it rather than covering it by accident of resolution.
      - run: python -c "import numpy; assert int(numpy.__version__.split('.')[0]) >= 2, numpy.__version__"
      # `-rs` prints the skips. A skipped test is not a passing test, and the
      # two the suite has by design should be visible in every log.
      - run: pytest tests/ -v -rs --cov=medh5 --cov-report=term-missing --cov-fail-under=90

  test-windows:
    # `atomic_rewrite` exists for a Windows failure --- `os.replace` onto a
    # source that is still open --- and until now nothing ran there. Core
    # extras only: the optional-dependency paths are the Linux matrix's job,
    # this one is about the platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,schema,nifti,dicom,dicomseg,interp]"
      - run: pytest tests/ -v -rs --no-cov -p no:cacheprovider

  test-min-deps:
    # The floors `pyproject.toml` declares, on the oldest interpreter it
    # supports. A floor nothing installs is a floor nobody has checked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev,schema]"
      - run: pip install "numpy==1.24.*" "h5py==3.13.*" "hdf5plugin==4.1.*"
      - run: python -c "import numpy, h5py, hdf5plugin; print(numpy.__version__, h5py.__version__, hdf5plugin.version)"
      - run: pytest tests/ -v -rs --no-cov -p no:cacheprovider

  test-macos:
    # macOS defaults to the `spawn` multiprocessing start method,
    # which is where the h5py DataLoader and ProcessPoolExecutor
    # regressions bite. Keep this job on a single Python version —
    # its job is to exercise the spawn path, not re-verify the matrix.
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,schema,torch,nifti,dicom,dicomseg,itk,interp]"
      - run: pytest tests/ -v -rs --cov=medh5 --cov-report=term-missing --cov-fail-under=90

  test-monai:
    # MONAI is a heavy dependency for a handful of tests, so it stays out of
    # the matrix and gets its own job rather than the `dev` extra --- but it
    # has to run *somewhere*.  `pytest.importorskip("monai")` skips silently
    # when it is absent, so `medh5.monai`'s level handling shipped covered by
    # a test that had never once executed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,nifti,monai]"
      # The point of the job. Without this the run stays green when the import
      # fails and every test skips, which is the state it exists to prevent.
      - run: python -c "import monai, torch"
      # Exit 5 if `-k` selects nothing, so a renamed class fails here too.
      - run: pytest tests/ -v -k "Monai or monai" --no-cov

  prototype:
    # Appendix C.2 publishes a table of results from the executable prototype
    # next to the spec.  Nothing referenced it, so that table was an ungated
    # claim -- unlike the corpus beside it, which CI runs on every push.  It is
    # deliberately dependency-light, so this job is cheap.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,schema]"
      - run: |
          mkdir -p "$RUNNER_TEMP/prototype"
          cd "$RUNNER_TEMP/prototype"
          python "$GITHUB_WORKSPACE/docs/examples/reference_writer.py"
      # The prototype prints "[ok] ..." per check and raises otherwise, so a
      # non-zero exit above is the gate. Confirm it wrote where it was told,
      # rather than into the checkout.
      - run: test -f "$RUNNER_TEMP/prototype/case_0001.medh5"
      - run: git diff --exit-code

  conformance:
    # The corpus is a shipped artifact, not a test fixture: a third-party
    # implementation runs the same 116 cases, and is scored the same way.
    # Running it here through `publish` + `score` exercises the public path
    # rather than the in-process one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,schema]"
      - run: medh5 conformance run corpus/
      - run: medh5 conformance publish suite/
      - run: |
          python - <<'PY'
          import json, subprocess
          manifest = json.load(open("suite/expected.json"))
          results = []
          for case in manifest["cases"]:
              # No `check=True`: `validate` exits non-zero for a file with
              # errors, and 76 of the 116 cases are deliberately invalid. The
              # exit code is the answer, not a failure.
              out = subprocess.run(
                  ["medh5", "validate", f"suite/{case['file']}",
                   "--level", case["level"], "--json"],
                  capture_output=True, text=True,
              ).stdout
              report = json.loads(out)[0]
              results.append({"file": case["file"], "diagnostics": report["diagnostics"]})
          json.dump(results, open("results.json", "w"))
          PY
      - run: medh5 conformance score suite/ results.json
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-suite
          path: suite/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade build twine packaging
      - run: python -m build
      - run: twine check dist/*
      - run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel produced"
          with zipfile.ZipFile(wheels[0]) as z:
              names = z.namelist()
          missing = [n for n in ("medh5/py.typed",) if n not in names]
          license_present = any(n.endswith("LICENSE") for n in names)
          if missing or not license_present:
              print("names:", names, file=sys.stderr)
              sys.exit(f"missing {missing or 'LICENSE'} in wheel")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
