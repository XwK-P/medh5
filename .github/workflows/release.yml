name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  ci:
    # The whole CI, on the tagged commit.  The pull request's checks ran on its
    # head, and a tag can be pushed on any commit; publishing waits on this.
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build distributions
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install --upgrade build twine

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          ref = os.environ["GITHUB_REF"]
          m = re.fullmatch(r"refs/tags/v(.+)", ref)
          if not m:
              sys.exit(f"unexpected GITHUB_REF: {ref}")
          tag_version = m.group(1)
          # `__about__` is the one source of the version: `pyproject.toml`
          # declares it dynamic and reads it from here, and it is what gets
          # stamped into every file's `generator` and into dataset manifests.
          about = {}
          exec((pathlib.Path("medh5") / "__about__.py").read_text(), about)
          if about["__version__"] != tag_version:
              sys.exit(
                  f"tag {tag_version!r} does not match medh5.__version__ "
                  f"{about['__version__']!r}"
              )
          print(f"tag and stamped version agree: {tag_version}")
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: twine check
        run: twine check dist/*

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel produced"
          with zipfile.ZipFile(wheels[0]) as z:
              names = z.namelist()
          missing = [n for n in ("medh5/py.typed",) if n not in names]
          license_present = any(n.endswith("LICENSE") for n in names)
          if missing or not license_present:
              sys.exit(f"wheel missing required files: missing={missing} license={license_present}")
          print("wheel contents ok")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/medh5
    permissions:
      id-token: write   # OIDC exchange for Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish via PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
