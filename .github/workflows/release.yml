name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  ci:
    # The whole CI, on the tagged commit.  The pull request's checks ran on its
    # head, and a tag can be pushed on any commit; publishing waits on this.
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build distributions
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install --upgrade build twine

      - name: Classify the version
        id: version
        # By PEP 440, not by pattern: `1.5.0-rc.1` is `1.5.0rc1` spelled
        # another way, and either is a pre-release.  `packaging` is here
        # because `build` and `twine` require it.
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from packaging.version import Version
          version = Version(os.environ["GITHUB_REF_NAME"].removeprefix("v"))
          print(f"prerelease={str(version.is_prerelease).lower()}")
          PY

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          ref = os.environ["GITHUB_REF"]
          m = re.fullmatch(r"refs/tags/v(.+)", ref)
          if not m:
              sys.exit(f"unexpected GITHUB_REF: {ref}")
          tag_version = m.group(1)
          # `__about__` is the one source of the version: `pyproject.toml`
          # declares it dynamic and reads it from here, and it is what gets
          # stamped into every file's `generator` and into dataset manifests.
          about = {}
          exec((pathlib.Path("medh5") / "__about__.py").read_text(), about)
          if about["__version__"] != tag_version:
              sys.exit(
                  f"tag {tag_version!r} does not match medh5.__version__ "
                  f"{about['__version__']!r}"
              )
          print(f"tag and stamped version agree: {tag_version}")
          PY

      - name: Extract release notes from CHANGELOG.md
        # Here rather than in the release job: a tag whose version has no
        # CHANGELOG section fails before anything reaches PyPI, not after.
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
              text,
              re.M | re.S,
          )
          notes = m.group(1).strip() if m else ""
          if not notes:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          # A relative link resolves in GitHub's file view and on the docs
          # site, but not on a release page. Pin each one to the tagged commit.
          blob = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{tag}/"
          notes = re.sub(r"\]\((?!https?://|#|mailto:)", "](" + blob, notes)
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          print(f"release notes: {len(notes)} characters from CHANGELOG.md [{version}]")
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: twine check
        run: twine check dist/*

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel produced"
          with zipfile.ZipFile(wheels[0]) as z:
              names = z.namelist()
          missing = [n for n in ("medh5/py.typed",) if n not in names]
          license_present = any(n.endswith("LICENSE") for n in names)
          if missing or not license_present:
              sys.exit(f"wheel missing required files: missing={missing} license={license_present}")
          print("wheel contents ok")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/medh5
    permissions:
      id-token: write   # OIDC exchange for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish via PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create the GitHub Release
    # After PyPI rather than beside it, so a release is never announced for a
    # version that `pip install` cannot find.
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and attach the distributions
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Create the release, with the distributions PyPI received
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          # A pre- or dev-release must not become the repository's "Latest".
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "medh5 ${TAG#v}" \
            --notes-file release-notes.md \
            --verify-tag \
            "${flags[@]}"
