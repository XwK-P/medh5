name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  ci:
    # The whole CI, on the tagged commit.  The pull request's checks ran on its
    # head, and a tag can be pushed on any commit; publishing waits on this,
    # and publishes the wheels, sdist and binaries this run built.
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Collect and check the distributions
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install --upgrade twine packaging

      - name: Classify the version
        id: version
        # By PEP 440, not by pattern: `1.5.0-rc.1` is `1.5.0rc1` spelled
        # another way, and either is a pre-release.
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from packaging.version import Version
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          print(f"version={tag}")
          print(f"prerelease={str(Version(tag).is_prerelease).lower()}")
          PY

      - name: Verify the tag matches the version
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          ref = os.environ["GITHUB_REF"]
          m = re.fullmatch(r"refs/tags/v(.+)", ref)
          if not m:
              sys.exit(f"unexpected GITHUB_REF: {ref}")
          tag_version = m.group(1)
          # The Cargo workspace is the one source of the version: every crate
          # inherits it, maturin stamps it on the wheel, and the engine writes
          # it into every file's `generator`.
          with open("Cargo.toml", "rb") as f:
              version = tomllib.load(f)["workspace"]["package"]["version"]
          if version != tag_version:
              sys.exit(f"tag {tag_version!r} does not match the workspace version {version!r}")
          print(f"tag and workspace version agree: {tag_version}")
          PY

      - name: Extract release notes from CHANGELOG.md
        # Here rather than in the release job: a tag whose version has no
        # CHANGELOG section fails before anything is published, not after.
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
              text,
              re.M | re.S,
          )
          notes = m.group(1).strip() if m else ""
          if not notes:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          # A relative link resolves in GitHub's file view and on the docs
          # site, but not on a release page. Pin each one to the tagged commit.
          blob = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{tag}/"
          notes = re.sub(r"\]\((?!https?://|#|mailto:)", "](" + blob, notes)
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          print(f"release notes: {len(notes)} characters from CHANGELOG.md [{version}]")
          PY

      - name: Download what CI built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-dist-*
          merge-multiple: true
          path: dist/

      - name: Download the binaries CI built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-cli-*
          merge-multiple: true
          path: cli/

      - name: twine check
        run: twine check dist/*

      - name: Verify every platform, at this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, sys, zipfile
          from packaging.version import Version
          # The wheels carry PEP 440's spelling of the version (2.1.0rc1), the
          # binaries Cargo's (2.1.0-rc.1, as tagged).
          raw = os.environ["VERSION"]
          version = Version(raw)
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          sdists = sorted(pathlib.Path("dist").glob("*.tar.gz"))
          # One abi3 wheel per platform the project ships.
          platforms = ("manylinux_2_28_x86_64", "manylinux_2_28_aarch64",
                       "macosx_11_0_arm64", "macosx_11_0_x86_64", "win_amd64")
          problems = []
          for platform in platforms:
              found = [w for w in wheels if w.name.endswith(f"-cp310-abi3-{platform}.whl")]
              if len(found) != 1:
                  problems.append(f"{len(found)} wheels for {platform}")
          if len(sdists) != 1:
              problems.append(f"{len(sdists)} sdists")
          for dist in [*wheels, *sdists]:
              if Version(dist.name.split("-")[1].removesuffix(".tar.gz")) != version:
                  problems.append(f"{dist.name} is not version {version}")
          for wheel in wheels:
              names = zipfile.ZipFile(wheel).namelist()
              for required in ("medh5/py.typed", "medh5/_core.pyi"):
                  if required not in names:
                      problems.append(f"{wheel.name} lacks {required}")
              if not any(n.startswith("medh5/_core.") and not n.endswith(".pyi") for n in names):
                  problems.append(f"{wheel.name} lacks the compiled engine")
              if not any(n.endswith("LICENSE") for n in names):
                  problems.append(f"{wheel.name} lacks the licence")
          binaries = sorted(p.name for p in pathlib.Path("cli").iterdir())
          for target in ("x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
                         "aarch64-apple-darwin", "x86_64-apple-darwin"):
              if f"medh5-{raw}-{target}.tar.gz" not in binaries:
                  problems.append(f"no binary for {target}")
          if f"medh5-{raw}-x86_64-pc-windows-msvc.zip" not in binaries:
              problems.append("no binary for x86_64-pc-windows-msvc")
          if problems:
              sys.exit("\n".join(problems))
          print(*(p.name for p in [*wheels, *sdists]), *binaries, sep="\n")
          PY

      - name: Checksum the binaries, and write the Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd cli && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          mkdir homebrew
          python .github/scripts/homebrew_formula.py "$VERSION" cli/SHA256SUMS "$GITHUB_REPOSITORY" > homebrew/medh5.rb
          cat homebrew/medh5.rb

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli
          path: cli/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew
          path: homebrew/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/medh5
    permissions:
      id-token: write   # OIDC exchange for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish via PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  crates:
    name: Publish to crates.io
    # medh5-sys, then medh5, then medh5-cli: `--workspace` publishes in
    # dependency order, waits for each to reach the index, and leaves out
    # medh5-python, which is `publish = false`.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/medh5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set, so the crates were not published"
            exit 0
          fi
          cargo publish --workspace --locked

  github-release:
    name: Create the GitHub Release
    # After the registries rather than beside them, so a release is never
    # announced for a version that `pip install` or `cargo install` cannot find.
    needs: [build, publish, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and attach its files
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli
          path: cli/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      - name: Create the release, with the distributions and the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          # A pre- or dev-release must not become the repository's "Latest".
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* cli/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "medh5 ${TAG#v}" \
            --notes-file release-notes.md \
            --verify-tag \
            "${flags[@]}"

  homebrew:
    name: Update the Homebrew tap
    # The formula points at the release's binaries, so it follows the release.
    # The tap is `<owner>/homebrew-medh5` unless the HOMEBREW_TAP variable names
    # another; HOMEBREW_TAP_TOKEN needs write access to it.
    needs: [build, github-release]
    if: needs.build.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew
          path: homebrew/

      - name: Push the formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ vars.HOMEBREW_TAP || format('{0}/homebrew-medh5', github.repository_owner) }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so $TAP was not updated"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" tap
          mkdir -p tap/Formula
          cp homebrew/medh5.rb tap/Formula/medh5.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/medh5.rb
          git commit -m "medh5 $VERSION"
          git push
