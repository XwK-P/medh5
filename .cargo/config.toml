# HDF5 is compiled by `hdf5-metno-src` through cmake-rs. Under MSVC's Visual
# Studio generator, cmake-rs sets `CMAKE_C_FLAGS_RELEASE` to the flags `cc`
# derives, which replaces CMake's `/O2 /Ob2 /DNDEBUG`: HDF5 keeps its
# `assert`s in a release build, and a damaged file aborts the process (in
# `H5A__attr_release_table`, for one) where every other build returns the
# error the validator reports. `cc` reads `CFLAGS_<target>` into those flags,
# so NDEBUG is given here, to every C build of these targets --- as a release
# build of each would have it.
[env]
CFLAGS_x86_64_pc_windows_msvc = "/DNDEBUG"
CFLAGS_aarch64_pc_windows_msvc = "/DNDEBUG"
